[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wechat-longshot"
version = "0.1.0"
description = "Turn a WeChat (macOS) chat window into one tall screenshot and a PDF"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "EtheXReal" }]
keywords = ["wechat", "screenshot", "macos", "pdf", "ocr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
dependencies = [
    "numpy",
    "opencv-python-headless",
    "Pillow",
    "typer",
    "pyobjc-framework-Quartz",
    "pyobjc-framework-Vision",
    "pyobjc-framework-ApplicationServices",
    "pyobjc-framework-Cocoa",
    "pyobjc-framework-ScreenCaptureKit",
]

[project.scripts]
wechat-longshot = "wechat_longshot.cli:app"
wechat-longshot-gui = "wechat_longshot.gui:main"

[project.urls]
Homepage = "https://github.com/EtheXReal/wechat-longshot"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["wechat_longshot"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
